name: rescatapet_mobile
description: "Aplicacion Movil RescataPet EC para el Taller Practico Semana 9"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  image_picker: ^1.2.3
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
