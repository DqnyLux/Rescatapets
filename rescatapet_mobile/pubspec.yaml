publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
