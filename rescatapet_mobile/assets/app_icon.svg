<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="crossGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle inner shadow/depth -->
  <rect x="8" y="8" width="496" height="496" rx="100" ry="100" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>

  <!-- Rescue cross behind the paw (subtle, shifted down-right) -->
  <g transform="translate(256, 290)" opacity="0.15">
    <rect x="-90" y="-30" width="180" height="60" rx="8" fill="#FFFFFF"/>
    <rect x="-30" y="-90" width="60" height="180" rx="8" fill="#FFFFFF"/>
  </g>

  <!-- Main paw print - white, centered, bold -->
  <g transform="translate(256, 240)" fill="#FFFFFF">
    <!-- Main pad -->
    <ellipse cx="0" cy="52" rx="62" ry="50"/>

    <!-- Top-left toe -->
    <ellipse cx="-58" cy="-18" rx="28" ry="34" transform="rotate(-12, -58, -18)"/>

    <!-- Top-right toe -->
    <ellipse cx="58" cy="-18" rx="28" ry="34" transform="rotate(12, 58, -18)"/>

    <!-- Inner-left toe -->
    <ellipse cx="-22" cy="-52" rx="24" ry="30" transform="rotate(-5, -22, -52)"/>

    <!-- Inner-right toe -->
    <ellipse cx="22" cy="-52" rx="24" ry="30" transform="rotate(5, 22, -52)"/>
  </g>

  <!-- Small location pin at bottom-right of paw -->
  <g transform="translate(340, 350)">
    <path d="M0,-28 C-16,-28 -28,-16 -28,0 C-28,16 0,36 0,36 C0,36 28,16 28,0 C28,-16 16,-28 0,-28 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="-2" r="9" fill="#EA580C"/>
  </g>

  <!-- App name hint at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF" opacity="0.95" letter-spacing="3">RESCATA</text>
</svg>